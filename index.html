<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe JS by 21-01</title>
    <script src="game.js" defer></script>
    <style>
    td,
    th {
        border: 1px solid rgb(190, 190, 190);
        padding: 10px;
        width: 24px;
        height: 24px;
        text-align: center;
        background-color: white;
        font-family: Arial, Helvetica, sans-serif;
    }
    td:hover{
        background-color: lightgray;
    }
    </style>
</head>
<body>
    Tic Tac Tol(ol)
    <table>
        <caption>Gameboard</caption>
        <tr>
            <td id="0"></td>
            <td id="1"></td>
            <td id="2"></td>
        </tr>
        <tr>
            <td id="3"></td>
            <td id="4"></td>
            <td id="5"></td>
        </tr>
        <tr>
            <td id="6"></td>
            <td id="7"></td>
            <td id="8"></td>
        </tr>
    </table>
</body>
</html>
